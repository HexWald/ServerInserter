name: Feature request
description: Suggest an improvement for ServerInserter
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Suggest one change at a time. A concrete workflow beats a big wishlist.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What feels slow, confusing, missing, or repetitive?
      placeholder: I often need to...
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Suggested solution
      description: Describe the change you want to see.
      placeholder: ServerInserter should...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Have you tried another workflow or workaround?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import flow
        - Preview table
        - Backups
        - File selection
        - UI theme
        - Build or release
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Add screenshots, examples, or notes if they help.
