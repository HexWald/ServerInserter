name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build on Linux
        if: runner.os == 'Linux'
        run: bash ./mvnw -B verify

      - name: Build on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-inserter-${{ runner.os }}
          path: target/minecraft-server-inserter-*.jar
