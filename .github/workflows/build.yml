name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and package
        run: bash ./mvnw -B test package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-inserter
          path: target/minecraft-server-inserter-*.jar
